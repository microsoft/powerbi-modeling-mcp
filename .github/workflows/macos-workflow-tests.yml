name: macOS workflow helper tests

on:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/macos-workflow-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -v
